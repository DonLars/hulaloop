<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wunschliste · hulaloop</title>
<link rel="stylesheet" href="/static/style.css?v=57">
</head>
<body class="dashboard playlist-view">
  <header class="dash-header">
    <h1>Wunschliste</h1>
    <div class="status">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">verbinde…</span>
    </div>
  </header>

  <p class="hint">Nur zum Anschauen – der DJ entscheidet, was gespielt wird.</p>

  <ul id="wish-list" class="wish-list"></ul>
  <p id="empty" class="hint hidden">Noch keine Songwünsche eingegangen.</p>

  <section id="played-section" class="played-section">
    <h2>Bereits gespielt</h2>
    <ul id="played-list" class="wish-list"></ul>
    <p id="played-empty" class="hint hidden">Noch keine Songs gespielt.</p>
    <button id="played-more" class="hidden" type="button" title="Weitere gespielte Songs anzeigen">Alle anzeigen</button>
  </section>

  <a href="/" class="link-button playlist-link" title="Eigenen Songwunsch senden">Wünsch dir was</a>

  <script src="/static/playlist.js?v=29"></script>
</body>
</html>
