<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ-Dashboard · Songwünsche</title>
<link rel="stylesheet" href="/static/style.css?v=74">
</head>
<body class="dashboard">
  <header class="dash-header">
    <h1>DJ Dashboard</h1>
    <div class="status">
      <span class="conn-badge">
        <span id="conn-dot" class="dot"></span>
        <span id="conn-text">verbinde…</span>
      </span>
      <button id="sound-toggle" class="icon-toggle" aria-label="Ton an/aus" title="Ton an/aus"></button>
      <button id="played-toggle" class="icon-toggle" aria-label="Bereits gespielt für Gäste an/aus" title="Bereits gespielt für Gäste an/aus"></button>
      <button id="reset-all" class="danger-button" title="Alle Wünsche und den Verlauf zurücksetzen">Reset</button>
    </div>
  </header>

  <ul id="wish-list" class="wish-list"></ul>
  <p id="empty" class="hint hidden">Noch keine Songwünsche eingegangen.</p>

  <section class="played-section">
    <div class="played-header">
      <h2>Gespielte Songs</h2>
      <div class="played-actions">
        <a id="export-csv" class="link-button" href="/api/wishes/played/export.csv" title="Gespielte Songs als CSV-Datei herunterladen">CSV herunterladen</a>
        <button id="clear-played" class="danger-button" title="Alle gespielten Songs endgültig löschen">Alle löschen</button>
      </div>
    </div>
    <ul id="played-list" class="wish-list"></ul>
    <p id="played-empty" class="hint hidden">Noch keine Songs gespielt.</p>
    <button id="played-more" class="hidden" type="button" title="Weitere gespielte Songs anzeigen">Alle anzeigen</button>
  </section>

  <section class="played-section qr-section">
    <h2>WLAN</h2>
    <div class="qr-grid">
      <div class="qr-card qr-card-wifi">
        <form id="wifi-form" class="wifi-form" autocomplete="off">
          <label for="wifi-ssid">SSID</label>
          <div class="wifi-row">
            <input type="text" id="wifi-ssid" maxlength="32" required>
            <button type="submit" class="icon-save" title="WLAN-Namen speichern" aria-label="WLAN-Namen speichern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8"/></svg></button>
            <a id="wifi-download" href="/api/dashboard/wifi-qr.svg?download=1" title="WLAN-QR-Code als SVG herunterladen" aria-label="WLAN-QR-Code als SVG herunterladen">
              <img id="wifi-qr" alt="WLAN-QR-Code – anklicken zum SVG-Download" width="44" height="44">
            </a>
          </div>
          <p id="wifi-msg" class="hint hidden"></p>
        </form>
      </div>
    </div>
  </section>

  <script src="/static/render-gate.js?v=1"></script>
  <script src="/static/dashboard.js?v=34"></script>
</body>
</html>
