<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songwunsch an den DJ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>🎧 Songwunsch</h1>
    <p class="hint">
      Dieses WLAN dient nur für Songwünsche und hat kein Internet.
      Für eigenes Internet bitte WLAN kurz deaktivieren oder mobile Daten nutzen.
    </p>

    <form id="wish-form">
      <label for="interpret">Interpret *</label>
      <input type="text" id="interpret" name="interpret" required maxlength="200" autocomplete="off">

      <label for="song">Song *</label>
      <input type="text" id="song" name="song" required maxlength="200" autocomplete="off">

      <label for="nachricht">Nachricht an den DJ (optional)</label>
      <textarea id="nachricht" name="nachricht" maxlength="500" rows="3"></textarea>

      <button type="submit">Wunsch senden</button>
    </form>

    <div id="success" class="success hidden">
      ✅ Danke! Dein Wunsch ist beim DJ angekommen.
      <button id="again">Noch einen Wunsch senden</button>
    </div>

    <div id="error" class="error hidden"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
