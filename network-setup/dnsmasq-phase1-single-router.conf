# Phase 1: Einzelner WLAN-Router (z.B. GL.iNet AR300M Shadow)
#
# Diese Zeile im Router-Webinterface unter
#   Network → DHCP and DNS → Advanced Settings → "Additional dnsmasq options"
# eintragen (oder per SSH in /etc/dnsmasq.conf einfügen und
# `/etc/init.d/dnsmasq restart` ausführen).
#
# 192.168.8.100 durch die tatsächliche, feste IP des DJ-PCs ersetzen,
# falls eine andere Adresse für die Static Lease vergeben wurde.

# Jede Domain-Anfrage aus dem Gäste-WLAN auf den DJ-PC umleiten.
# Löst den automatischen Captive-Portal-Popup auf iOS/Android/Windows aus,
# weil die Connectivity-Checks der Geräte dadurch fehlschlagen.
address=/#/192.168.8.100
